# =====================================
# POSTGRESQL DATABASE - PGADMIN 4
# =====================================
spring.application.name=course-management
# Ket noi PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/course_management
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# =====================================
# JPA - HIBERNATE
# =====================================
# Tu dong tao va cap nhat bang
spring.jpa.hibernate.ddl-auto=update
# Tat Open Session In View
spring.jpa.open-in-view=false
# Cau hinh PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Hien thi SQL trong Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# =====================================
# SERVER
# =====================================
server.port=8080
server.error.whitelabel.enabled=false
# =====================================
# THYMELEAF
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
