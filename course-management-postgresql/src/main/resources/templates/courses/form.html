<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h2 th:text="${course.id == null} ? 'Thêm khóa học' : 'Sửa khóa học'"></h2>
    <form method="post" action="/courses/save" th:object="${course}" class="card card-body"><input type="hidden"
                                                                                                   th:field="*{id}">
        <div class="mb-3"><label>Tên khóa học *</label><input class="form-control" th:field="*{name}">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3"><label>Học phí (VND) *</label><input type="number" step="0.01" min="0.01"
                                                                            class="form-control"
                                                                            th:field="*{tuitionFee}">
                <div class="text-danger" th:errors="*{tuitionFee}"></div>
            </div>
            <div class="col-md-6 mb-3"><label>Thời lượng (giờ) *</label><input type="number" min="1"
                                                                               class="form-control"
                                                                               th:field="*{duration}">
                <div class="text-danger" th:errors="*{duration}"></div>
            </div>
        </div>
        <div class="mb-3"><label>Loại khóa học *</label><select name="categoryId" class="form-select">
            <option value="">-- Chọn loại --</option>
            <option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}"
                    th:selected="${course.category != null and course.category.id == cat.id}"></option>
        </select>
            <div class="text-danger" th:errors="*{category}"></div>
        </div>
        <div class="mb-3"><label>Mô tả</label><textarea class="form-control" rows="3"
                                                        th:field="*{description}"></textarea></div>
        <div class="mb-3"><label><input type="checkbox" th:field="*{active}"> Đang tuyển sinh</label></div>
        <button class="btn btn-primary">Lưu khóa học</button>
        <a href="/courses" class="btn btn-link">Quay lại</a></form>
</main>
</body>
</html>
