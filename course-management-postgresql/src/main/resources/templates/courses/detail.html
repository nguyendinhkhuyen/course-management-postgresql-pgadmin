<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="d-flex justify-content-between"><h2 th:text="${course.name}"></h2><a href="/courses"
                                                                                     class="btn btn-outline-secondary">Quay
        lại</a></div>
    <div class="card card-body mb-4"><p><b>Loại:</b> <span th:text="${course.category.name}"></span></p>
        <p><b>Học phí:</b> <span th:text="${course.tuitionFee}"></span> VND</p>
        <p><b>Thời lượng:</b> <span th:text="${course.duration}"></span> giờ — <span
                th:text="${course.durationLabel}"></span></p>
        <p><b>Trạng thái:</b> <span th:text="${course.active} ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'"></span></p>
        <p th:text="${course.description}"></p><a class="btn btn-outline-primary"
                                                  th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa khóa học</a>
    </div>
    <h3>Hình ảnh khóa học</h3>
    <p th:if="${#lists.isEmpty(images)}" class="alert alert-info">Khóa học chưa có ảnh.</p>
    <div class="row g-3 mb-4">
        <div class="col-md-4" th:each="img:${images}">
            <div class="card h-100"><img class="card-img-top course-img" th:src="${img.imageUrl}" alt="Ảnh khóa học"
                                         onerror="this.style.display='none'">
                <div class="card-body"><span th:if="${img.thumbnail}" class="badge bg-success">Ảnh đại diện</span>
                    <p class="small text-break" th:text="${img.imageUrl}"></p>
                    <form method="post" th:unless="${img.thumbnail}"
                          th:action="@{/courses/{id}/images/{imageId}/thumbnail(id=${course.id},imageId=${img.id})}">
                        <button class="btn btn-sm btn-primary">Đặt làm ảnh đại diện</button>
                    </form>
                    <form method="post" class="mt-2"
                          th:action="@{/courses/{id}/images/{imageId}/delete(id=${course.id},imageId=${img.id})}">
                        <button class="btn btn-sm btn-outline-danger">Xóa ảnh</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <form method="post" class="card card-body" th:action="@{/courses/{id}/images(id=${course.id})}"><label>Thêm ảnh bằng
        URL (http/https)</label>
        <div class="input-group"><input class="form-control" type="url" name="imageUrl" required
                                        placeholder="https://example.com/photo.jpg">
            <button class="btn btn-primary">Thêm ảnh</button>
        </div>
    </form>
</main>
</body>
</html>
