<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h2>Sửa loại khóa học</h2>
    <form method="post" th:action="@{/categories/{id}/edit(id=${category.id})}" th:object="${category}"
          class="card card-body"><label>Tên loại *</label><input class="form-control" th:field="*{name}">
        <div class="text-danger" th:errors="*{name}"></div>
        <label>Mô tả</label><textarea class="form-control mb-3" th:field="*{description}"></textarea>
        <button class="btn btn-primary">Lưu</button>
    </form>
</main>
</body>
</html>
