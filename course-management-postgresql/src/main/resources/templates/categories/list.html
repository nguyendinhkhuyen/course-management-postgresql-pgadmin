<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h2>Loại khóa học</h2>
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Mô tả</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c:${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td><a class="btn btn-sm btn-outline-primary" th:href="@{/categories/{id}/edit(id=${c.id})}">Sửa</a>
                <form class="d-inline" method="post" th:action="@{/categories/{id}/delete(id=${c.id})}">
                    <button class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <h3>Thêm loại khóa học</h3>
    <form method="post" action="/categories" th:object="${category}" class="card card-body"><label>Tên loại
        *</label><input class="form-control mb-1" th:field="*{name}">
        <div class="text-danger" th:errors="*{name}"></div>
        <label>Mô tả</label><textarea class="form-control mb-3" th:field="*{description}"></textarea>
        <button class="btn btn-primary">Thêm loại</button>
    </form>
</main>
</body>
</html>
