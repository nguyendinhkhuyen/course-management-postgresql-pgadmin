<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý khóa học</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container"><div th:replace="~{fragments/layout :: messages}"></div><div class="d-flex justify-content-between align-items-center mb-3"><h2>Danh sách khóa học</h2><a class="btn btn-primary" href="/courses/new">+ Thêm khóa học</a></div><form method="get" action="/courses" class="card card-body mb-4"><div class="row g-3"><div class="col-md-4"><label>Tìm tên</label><input class="form-control" name="q" th:value="${q}" placeholder="Nhập tên khóa học"></div><div class="col-md-4"><label>Loại khóa học</label><select class="form-select" name="categoryId"><option value="">Tất cả</option><option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId != null and categoryId == cat.id}"></option></select></div><div class="col-md-4"><label>Sắp xếp</label><select class="form-select" name="sort"><option value="">Mặc định</option><option value="feeAsc" th:selected="${sort == 'feeAsc'}">Học phí tăng dần</option><option value="feeDesc" th:selected="${sort == 'feeDesc'}">Học phí giảm dần</option><option value="durationAsc" th:selected="${sort == 'durationAsc'}">Thời lượng tăng dần</option></select></div><div class="col-md-3"><label>Học phí tối thiểu</label><input class="form-control" type="number" min="0" step="0.01" name="minFee" th:value="${minFee}"></div><div class="col-md-3"><label>Học phí tối đa</label><input class="form-control" type="number" min="0" step="0.01" name="maxFee" th:value="${maxFee}"></div><div class="col-md-3 d-flex align-items-end"><label><input type="checkbox" name="activeOnly" value="true" th:checked="${activeOnly}"> Chỉ đang tuyển sinh</label></div><div class="col-md-3 d-flex align-items-end gap-2"><button class="btn btn-primary" type="submit">Tìm / Lọc</button><a class="btn btn-outline-secondary" href="/courses">Xóa lọc</a></div></div></form><div th:if="${courses != null}" class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>ID</th><th>Khóa học</th><th>Loại</th><th>Học phí (VND)</th><th>Giờ</th><th>Phân loại</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c:${courses}"><td th:text="${c.id}"></td><td th:text="${c.name}"></td><td th:text="${c.category.name}"></td><td th:text="${#numbers.formatDecimal(c.tuitionFee,1,'POINT',0,'COMMA')}"></td><td th:text="${c.duration}"></td><td th:text="${c.durationLabel}"></td><td><span th:class="${c.active} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${c.active} ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'"></span></td><td class="text-nowrap"><a th:href="@{/courses/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Chi tiết</a> <a th:href="@{/courses/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-warning">Sửa</a><form class="d-inline" method="post" th:action="@{/courses/{id}/delete(id=${c.id})}" onsubmit="return confirm('Xóa khóa học này?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr></tbody></table><p th:if="${#lists.isEmpty(courses)}" class="alert alert-info">Không có khóa học phù hợp.</p></div></main></body></html>
